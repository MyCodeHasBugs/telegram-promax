name: Build E2EChatClient

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - run: dotnet restore E2EChatClient/E2EChatClient.csproj
    - run: |
        dotnet publish E2EChatClient/E2EChatClient.csproj `
          -c Debug -r win-x64 --self-contained true `
          -p:PublishSingleFile=true -o ./publish
    - uses: actions/upload-artifact@v4
      with:
        name: E2EChatClient
        path: ./publish/**

  create-release:
    needs: build-debug
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: E2EChatClient
        path: ./release-files
    - run: |
        cd release-files
        zip -r ../E2EChatClient-${{ github.ref_name }}.zip .
    - uses: softprops/action-gh-release@v1
      with:
        files: E2EChatClient-${{ github.ref_name }}.zip
        generate_release_notes: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}